<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Red Archive seal</title>
  <desc id="desc">An original archival seal with a star, sword, abstract hammer and sickle, and data ring.</desc>

  <!-- Teal archive data ring -->
  <circle cx="64" cy="69" r="43" fill="none" stroke="#3fd8c4" stroke-width="7"/>
  <circle cx="64" cy="69" r="43" fill="none" stroke="#0a0508" stroke-width="11"/>
  <circle cx="64" cy="69" r="43" fill="none" stroke="#3fd8c4" stroke-width="5" stroke-dasharray="76 10 18 10"/>

  <!-- Central archival spine -->
  <path d="M59 35h10v67l-5 15-5-15z" fill="#ff2b3d" stroke="#0a0508" stroke-width="5" stroke-linejoin="round"/>
  <path d="M64 40v59" stroke="#f5b70a" stroke-width="3" stroke-linecap="round"/>

  <!-- Simplified hammer -->
  <path d="M24 71 42 53l14 14-18 18z" fill="#ff2b3d" stroke="#0a0508" stroke-width="5" stroke-linejoin="round"/>
  <path d="m45 67 39 39" stroke="#ff2b3d" stroke-width="11" stroke-linecap="round"/>
  <path d="m45 67 39 39" stroke="#0a0508" stroke-width="17" stroke-linecap="round"/>
  <path d="m45 67 39 39" stroke="#ff2b3d" stroke-width="9" stroke-linecap="round"/>

  <!-- Abstract sickle -->
  <path d="M97 47c18 27 4 55-22 61l-6-10c18-4 27-23 17-41z" fill="#f5b70a" stroke="#0a0508" stroke-width="5" stroke-linejoin="round"/>

  <!-- Locator star -->
  <polygon points="64,8 70,24 87,24 73,34 78,51 64,41 50,51 55,34 41,24 58,24" fill="#f5b70a" stroke="#0a0508" stroke-width="5" stroke-linejoin="round"/>
</svg>
